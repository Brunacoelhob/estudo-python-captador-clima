name: CI

on:
  push:
    branches: [main, 'melhoria/**']
  pull_request:

permissions:
  contents: read

jobs:
  testes:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python: ['3.10', '3.12']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
          cache: pip
          cache-dependency-path: requirements*.txt
      - run: pip install -r requirements-dev.txt
      - run: ruff check .
      - run: ruff format --check .
      - run: pytest -q
      - name: Sem a chave configurada, o programa avisa e sai com erro 1
        run: |
          set +e
          OPENWEATHER_API_KEY= python -m captador
          test $? -eq 1
